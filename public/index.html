<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Evidence Tool - 온라인 증거 보존</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:16px;
  background:#f4f5f7;
  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Apple SD Gothic Neo",
  "Malgun Gothic",
  sans-serif;
}

.wrap{
  max-width:760px;
  margin:auto;
}

h1{
  font-size:24px;
}

.desc{
  color:#666;
  line-height:1.6;
  margin-bottom:20px;
}

.card{
  background:white;
  padding:18px;
  border-radius:14px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

input,
textarea,
button{
  width:100%;
  padding:13px;
  border-radius:10px;
  font-size:15px;
}

input,
textarea{
  border:1px solid #ddd;
  margin-bottom:10px;
}

button{
  border:0;
  cursor:pointer;
  font-weight:bold;
}

.blue{
  background:#2563eb;
  color:white;
}

.green{
  background:#15803d;
  color:white;
}

.gray{
  background:#374151;
  color:white;
}

.hidden{
  display:none;
}

.meta{
  background:#f8fafc;
  padding:10px;
  border-radius:8px;
  margin-bottom:8px;
  word-break:break-all;
}

iframe{
  width:100%;
  height:500px;
  border:1px solid #ddd;
  border-radius:10px;
}

.status{
  margin-top:10px;
  text-align:center;
}

.success{
  color:#15803d;
  font-weight:bold;
}

</style>

</head>


<body>

<div class="wrap">


<h1>
Evidence Tool
</h1>

<div class="desc">
삭제되기 전 온라인 게시물의 증거를 수집하고<br>
제출용 PDF 자료로 보존합니다.
</div>


<div class="card">

<h3>
1. 원본 URL 입력
</h3>


<input
id="urlInput"
placeholder="게시물 URL 입력">


<button
id="captureBtn"
class="blue">

증거 PDF 생성

</button>


<div id="status"
class="status">

</div>

</div>



<div
id="infoCard"
class="card hidden">


<h3>
증거 정보
</h3>


<div id="meta"></div>


</div>




<div
id="pdfCard"
class="card hidden">


<h3>
PDF 확인
</h3>


<iframe
id="pdfFrame">
</iframe>


<br><br>


<button
id="downloadBtn"
class="green">

PDF 다운로드

</button>


</div>




<div
id="reportCard"
class="card hidden">


<h3>
신고 내용 복사
</h3>


<textarea
id="reportText"
rows="8">
</textarea>


<button
id="copyBtn"
class="gray">

내용 복사

</button>


</div>



</div>



<script>


let evidenceId=null;


function $(id){
 return document.getElementById(id);
}



$("captureBtn").onclick = async()=>{


const url =
$("urlInput").value.trim();


if(!url){

 alert("URL을 입력해주세요.");
 return;

}


$("status").innerText =
"증거 수집 중입니다...";


try{


const res =
await fetch(
"/api/capture",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:
JSON.stringify({
url
})

});


const data =
await res.json();



if(!res.ok){

throw new Error(
data.error || "실패"
);

}



evidenceId =
data.evidenceId;



const m =
data.metadata;



$("meta").innerHTML=`

<div class="meta">
제목<br>
${m.title || ""}
</div>

<div class="meta">
작성자<br>
${m.author || ""}
</div>

<div class="meta">
게시일<br>
${m.date || ""}
</div>

<div class="meta">
채널<br>
${m.channel || ""}
</div>

<div class="meta">
URL<br>
${m.url}
</div>

<div class="meta">
SHA256<br>
${m.hash}
</div>

`;



$("infoCard")
.classList
.remove("hidden");



$("pdfFrame").src =
data.previewUrl;



$("downloadBtn").onclick=()=>{

location.href =
data.downloadUrl;

};



$("pdfCard")
.classList
.remove("hidden");



$("reportText").value =
`
권익 침해 게시물 증거자료입니다.

제목:
${m.title}

작성자:
${m.author}

게시일:
${m.date}

원본 URL:
${m.url}

첨부 PDF:
증거자료 첨부

`;



$("reportCard")
.classList
.remove("hidden");



$("status").innerHTML =
"<span class='success'>PDF 생성 완료</span>";



}
catch(e){

$("status").innerText =
e.message;

}


};



$("copyBtn").onclick=()=>{


navigator.clipboard.writeText(
$("reportText").value
);


alert(
"신고 내용이 복사되었습니다."
);


};



</script>


</body>

</html>
