<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>증거 수집 도구</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #f5f6f8;
    color: #1a1a1a;
    padding: 20px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: #666; font-size: 13px; margin-top: 0; margin-bottom: 20px; }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 16px;
  }
  input[type="url"] {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    cursor: pointer;
  }
  button:disabled { background: #9ab4e8; }
  .meta { font-size: 13px; line-height: 1.6; color: #333; }
  .meta b { display: inline-block; width: 70px; color: #666; }
  .status { font-size: 13px; color: #888; text-align: center; padding: 12px 0; }
  .error { color: #c0392b; font-size: 13px; }
  a.download-btn {
    display: block;
    text-align: center;
    padding: 14px;
    background: #16a34a;
    color: #fff;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <h1>증거 수집 도구</h1>
  <p class="sub">악성 댓글/게시글 URL을 입력하면 증거용 PDF를 생성합니다. (공개 게시글 대상 MVP)</p>

  <div class="card">
    <input id="urlInput" type="url" placeholder="https://example.com/post/123" />
    <button id="captureBtn">증거 PDF 생성</button>
    <div id="status" class="status"></div>
  </div>

  <div id="resultCard" class="card" style="display:none;">
    <div id="metaBox" class="meta"></div>
    <a id="downloadLink" class="download-btn" download>PDF 다운로드</a>
  </div>

<script>
const btn = document.getElementById('captureBtn');
const urlInput = document.getElementById('urlInput');
const statusEl = document.getElementById('status');
const resultCard = document.getElementById('resultCard');
const metaBox = document.getElementById('metaBox');
const downloadLink = document.getElementById('downloadLink');

btn.addEventListener('click', async () => {
  const url = urlInput.value.trim();
  if (!url) {
    statusEl.innerHTML = '<span class="error">URL을 입력해주세요.</span>';
    return;
  }

  btn.disabled = true;
  statusEl.textContent = '페이지 접속 및 증거 수집 중... (최대 30초 소요)';
  resultCard.style.display = 'none';

  try {
    const res = await fetch('/api/capture', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || '알 수 없는 오류');
    }

    const metaHeader = res.headers.get('X-Evidence-Meta');
    const meta = metaHeader ? JSON.parse(decodeURIComponent(metaHeader)) : {};

    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);

    downloadLink.href = blobUrl;
    downloadLink.download = `evidence_${Date.now()}.pdf`;

    metaBox.innerHTML = `
      <div><b>제목</b> ${meta.title || '(추출 실패, 직접 확인 필요)'}</div>
      <div><b>작성자</b> ${meta.author || '(추출 실패)'}</div>
      <div><b>작성일</b> ${meta.date || '(추출 실패)'}</div>
      <div><b>수집시각</b> ${new Date(meta.capturedAt).toLocaleString('ko-KR')}</div>
      <div><b>URL</b> ${meta.url}</div>
      <div><b>해시</b> ${meta.hash ? meta.hash.slice(0,24)+'...' : '-'}</div>
    `;

    resultCard.style.display = 'block';
    statusEl.textContent = '';
  } catch (e) {
    statusEl.innerHTML = `<span class="error">오류: ${e.message}</span>`;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
