<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>증거 수집 도구</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  background: #f5f6f8;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Malgun Gothic",
    sans-serif;

  color: #111827;
}

.container {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
}

h1 {
  margin: 8px 0 4px;
  font-size: 23px;
}

.sub {
  margin: 0 0 18px;
  color: #6b7280;
  font-size: 13px;
  line-height: 1.5;
}

.card {
  background: white;

  border-radius: 14px;

  padding: 16px;

  margin-bottom: 16px;

  box-shadow:
    0 1px 5px
    rgba(0,0,0,0.08);
}

.card-title {
  font-size: 16px;

  font-weight: 700;

  margin-bottom: 12px;
}

input[type="url"] {

  width: 100%;

  padding: 13px;

  border: 1px solid #d1d5db;

  border-radius: 9px;

  font-size: 15px;

  margin-bottom: 12px;
}

button,
.btn {

  display: block;

  width: 100%;

  border: none;

  border-radius: 9px;

  padding: 14px;

  font-size: 15px;

  font-weight: 700;

  text-align: center;

  text-decoration: none;

  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

.primary {
  background: #2563eb;
  color: white;
}

.confirm {
  background: #111827;
  color: white;
}

.download {
  background: #16a34a;
  color: white;
  margin-top: 10px;
}

.open-pdf {
  background: #eef2ff;
  color: #1e40af;
  margin-top: 10px;
}

.status {

  text-align: center;

  font-size: 13px;

  color: #6b7280;

  padding-top: 10px;
}

.error {
  color: #dc2626;
}

.success {
  color: #15803d;
}

.meta-row {
  margin-bottom: 10px;
}

.label {
  font-size: 12px;

  font-weight: 600;

  color: #6b7280;

  margin-bottom: 4px;
}

.value {

  border: 1px solid #e5e7eb;

  background: #f9fafb;

  padding: 9px;

  border-radius: 8px;

  font-size: 13px;

  word-break: break-all;
}

.preview-box {

  width: 100%;

  height: 560px;

  border: 1px solid #d1d5db;

  border-radius: 10px;

  overflow: hidden;

  background: #e5e7eb;
}

.preview-box iframe {

  display: block;

  border: none;

  width: 100%;

  height: 100%;
}

.preview-note {

  font-size: 12px;

  color: #6b7280;

  line-height: 1.55;

  margin-top: 10px;
}

.confirm-warning {

  background: #fff7ed;

  border: 1px solid #fed7aa;

  border-radius: 9px;

  padding: 11px;

  font-size: 13px;

  line-height: 1.55;

  margin-bottom: 12px;
}

#confirmedBox {

  text-align: center;

  background: #ecfdf5;

  border: 1px solid #bbf7d0;

  padding: 14px;

  border-radius: 10px;

  font-size: 14px;

  color: #166534;

  font-weight: 700;
}

@media (max-width: 500px) {

  body {
    padding: 12px;
  }

  .preview-box {
    height: 470px;
  }
}

</style>

</head>


<body>

<div class="container">

  <h1>
    증거 수집 도구
  </h1>

  <p class="sub">
    게시물 URL 하나로 증거 PDF를 생성하고,
    내용을 확인한 뒤 신고를 진행합니다.
  </p>


  <div class="card">

    <div class="card-title">
      1. 게시물 URL
    </div>

    <input
      id="urlInput"
      type="url"
      placeholder="https://gall.dcinside.com/..."
    >

    <button
      id="captureBtn"
      class="primary"
    >
      증거 수집 시작
    </button>

    <div
      id="status"
      class="status"
    ></div>

  </div>



  <div
    id="infoCard"
    class="card"
    style="display:none;"
  >

    <div class="card-title">
      2. 수집 정보
    </div>

    <div id="metaBox"></div>

  </div>



  <div
    id="previewCard"
    class="card"
    style="display:none;"
  >

    <div class="card-title">
      3. PDF 확인
    </div>

    <div class="preview-box">

      <iframe
        id="pdfPreview"
        title="PDF 미리보기"
      ></iframe>

    </div>


    <a
      id="openPdfLink"
      class="btn open-pdf"
      target="_blank"
      rel="noopener"
    >
      PDF 크게 보기
    </a>


    <a
      id="downloadLink"
      class="btn download"
      download
    >
      PDF 다운로드
    </a>


    <div class="preview-note">
      본문, 댓글, 작성자, 작성일, URL,
      페이지 번호 등이 정상적으로 보이는지 확인해주세요.
      다운로드는 필수가 아닙니다.
    </div>

  </div>



  <div
    id="confirmCard"
    class="card"
    style="display:none;"
  >

    <div class="card-title">
      4. 신고 진행
    </div>


    <div class="confirm-warning">

      PDF를 확인한 뒤 문제가 없다면
      아래 버튼을 눌러주세요.

      <br><br>

      서버에 저장된 이 PDF가
      다음 단계에서 신고 첨부파일로 그대로 사용됩니다.

    </div>


    <button
      id="confirmBtn"
      class="confirm"
    >
      PDF 정상 확인 → 신고 진행
    </button>


    <div
      id="confirmedBox"
      style="display:none; margin-top:12px;"
    >
      PDF 확인 완료
      <br>
      신고 준비 단계로 이동할 수 있습니다.
    </div>

  </div>

</div>


<script>

const urlInput =
  document.getElementById(
    'urlInput'
  );

const captureBtn =
  document.getElementById(
    'captureBtn'
  );

const statusEl =
  document.getElementById(
    'status'
  );

const infoCard =
  document.getElementById(
    'infoCard'
  );

const previewCard =
  document.getElementById(
    'previewCard'
  );

const confirmCard =
  document.getElementById(
    'confirmCard'
  );

const metaBox =
  document.getElementById(
    'metaBox'
  );

const pdfPreview =
  document.getElementById(
    'pdfPreview'
  );

const openPdfLink =
  document.getElementById(
    'openPdfLink'
  );

const downloadLink =
  document.getElementById(
    'downloadLink'
  );

const confirmBtn =
  document.getElementById(
    'confirmBtn'
  );

const confirmedBox =
  document.getElementById(
    'confirmedBox'
  );


let currentEvidenceId = null;


function escapeHtml(value) {

  if (!value) return '';

  return value
    .toString()
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}


captureBtn.addEventListener(
  'click',
  async () => {

    const url =
      urlInput.value.trim();

    if (!url) {

      statusEl.innerHTML =
        '<span class="error">URL을 입력해주세요.</span>';

      return;
    }


    captureBtn.disabled =
      true;

    confirmBtn.disabled =
      false;

    confirmedBox.style.display =
      'none';

    infoCard.style.display =
      'none';

    previewCard.style.display =
      'none';

    confirmCard.style.display =
      'none';

    statusEl.textContent =
      '페이지 전체를 수집하고 PDF를 생성하고 있습니다...';


    try {

      const res =
        await fetch(
          '/api/capture',
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'application/json'
            },

            body:
              JSON.stringify({
                url
              })
          }
        );


      const data =
        await res.json();


      if (!res.ok) {

        throw new Error(
          data.error ||
          '증거 수집 실패'
        );
      }


      currentEvidenceId =
        data.evidenceId;


      const meta =
        data.metadata || {};


      metaBox.innerHTML = `

        <div class="meta-row">

          <div class="label">
            제목
          </div>

          <div class="value">
            ${escapeHtml(
              meta.title ||
              '(추출 실패)'
            )}
          </div>

        </div>


        <div class="meta-row">

          <div class="label">
            작성자
          </div>

          <div class="value">
            ${escapeHtml(
              meta.author ||
              '(추출 실패)'
            )}
          </div>

        </div>


        <div class="meta-row">

          <div class="label">
            게시 일자
          </div>

          <div class="value">
            ${escapeHtml(
              meta.date ||
              '(추출 실패)'
            )}
          </div>

        </div>


        <div class="meta-row">

          <div class="label">
            원본 URL
          </div>

          <div class="value">
            ${escapeHtml(
              meta.url || ''
            )}
          </div>

        </div>


        <div class="meta-row">

          <div class="label">
            수집시각
          </div>

          <div class="value">

            ${
              meta.capturedAt
                ? new Date(
                    meta.capturedAt
                  )
                  .toLocaleString(
                    'ko-KR'
                  )
                : '-'
            }

          </div>

        </div>

      `;


      pdfPreview.src =
        data.previewUrl;


      openPdfLink.href =
        data.previewUrl;


      downloadLink.href =
        data.downloadUrl;


      downloadLink.download =
        `evidence_${currentEvidenceId}.pdf`;


      infoCard.style.display =
        'block';

      previewCard.style.display =
        'block';

      confirmCard.style.display =
        'block';


      statusEl.innerHTML =
        '<span class="success">PDF 생성 완료. 아래에서 내용을 확인해주세요.</span>';


      setTimeout(() => {

        previewCard.scrollIntoView({
          behavior: 'smooth',
          block: 'start'
        });

      }, 200);


    } catch (err) {

      statusEl.innerHTML =
        `<span class="error">오류: ${escapeHtml(err.message)}</span>`;

    } finally {

      captureBtn.disabled =
        false;

    }

  }
);



confirmBtn.addEventListener(
  'click',
  async () => {

    if (!currentEvidenceId) {

      alert(
        '먼저 증거 PDF를 생성해주세요.'
      );

      return;
    }


    confirmBtn.disabled =
      true;

    confirmBtn.textContent =
      '확인 처리 중...';


    try {

      const res =
        await fetch(
          `/api/evidence/${currentEvidenceId}/confirm`,
          {
            method: 'POST'
          }
        );


      const data =
        await res.json();


      if (!res.ok) {

        throw new Error(
          data.error ||
          '확인 처리 실패'
        );
      }


      confirmedBox.style.display =
        'block';


      confirmBtn.textContent =
        'PDF 확인 완료';


      /*
       * 다음 단계:
       *
       * 여기서 currentEvidenceId 를
       * Galaxy 신고 자동입력 API에 넘깁니다.
       *
       * 예:
       *
       * /api/report/start/:evidenceId
       *
       * PDF는 사용자 폰이 아니라
       * Render 서버에 그대로 존재합니다.
       */


    } catch (err) {

      alert(
        err.message
      );

      confirmBtn.disabled =
        false;

      confirmBtn.textContent =
        'PDF 정상 확인 → 신고 진행';

    }

  }
);

</script>

</body>

</html>
