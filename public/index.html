<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>증거 수집 도구</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Apple SD Gothic Neo",
      "Malgun Gothic",
      sans-serif;
    background: #f5f6f8;
    color: #1a1a1a;
    padding: 20px;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
  }

  h1 {
    font-size: 22px;
    margin: 0 0 6px;
  }

  p.sub {
    color: #666;
    font-size: 13px;
    margin-top: 0;
    margin-bottom: 20px;
    line-height: 1.5;
  }

  .card {
    background: #fff;
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 16px;
  }

  .card-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 14px;
  }

  input[type="url"] {
    width: 100%;
    padding: 13px;
    font-size: 15px;
    border: 1px solid #ddd;
    border-radius: 9px;
    margin-bottom: 12px;
  }

  button,
  .btn {
    width: 100%;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    display: block;
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .primary {
    background: #2563eb;
    color: #fff;
  }

  .download {
    background: #16a34a;
    color: #fff;
    margin-top: 10px;
  }

  .report {
    background: #111827;
    color: #fff;
    margin-top: 10px;
  }

  .secondary {
    background: #eef2ff;
    color: #1e40af;
  }

  .status {
    font-size: 13px;
    color: #888;
    text-align: center;
    padding: 12px 0 0;
    min-height: 24px;
  }

  .error {
    color: #c0392b;
  }

  .success {
    color: #15803d;
  }

  .meta-row,
  .report-row {
    margin-bottom: 12px;
  }

  .label {
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 5px;
    font-weight: 600;
  }

  .value {
    font-size: 14px;
    line-height: 1.55;
    word-break: break-all;
    background: #f9fafb;
    border: 1px solid #eee;
    border-radius: 8px;
    padding: 10px;
  }

  .copy-btn {
    margin-top: 6px;
    padding: 8px 10px;
    width: auto;
    display: inline-block;
    background: #e5e7eb;
    color: #111827;
    font-size: 12px;
    border-radius: 7px;
  }

  textarea {
    width: 100%;
    min-height: 160px;
    resize: vertical;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 11px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
  }

  .hint {
    font-size: 12px;
    color: #777;
    line-height: 1.5;
    margin-top: 10px;
  }

  .badge {
    display: inline-block;
    background: #eef2ff;
    color: #3730a3;
    border-radius: 999px;
    padding: 4px 9px;
    font-size: 12px;
    font-weight: 600;
  }
</style>
</head>

<body>

<div class="container">

  <h1>증거 수집 도구</h1>
  <p class="sub">
    악성 댓글 또는 게시글 URL을 입력하면 원본 페이지 전체를 증거용 PDF로 생성하고,
    신고에 필요한 정보를 자동으로 정리합니다.
  </p>

  <div class="card">
    <div class="card-title">1. 게시물 URL 입력</div>

    <input
      id="urlInput"
      type="url"
      placeholder="https://gall.dcinside.com/..."
    />

    <button
      id="captureBtn"
      class="primary"
    >
      증거 PDF 생성
    </button>

    <div
      id="status"
      class="status"
    ></div>
  </div>


  <div
    id="resultCard"
    class="card"
    style="display:none;"
  >

    <div class="card-title">
      2. 증거 수집 결과
    </div>

    <div id="metaBox"></div>

    <a
      id="downloadLink"
      class="btn download"
      download
    >
      PDF 다운로드
    </a>

  </div>


  <div
    id="reportCard"
    class="card"
    style="display:none;"
  >

    <div class="card-title">
      3. 신고 준비
    </div>

    <div class="report-row">
      <div class="label">
        게시 채널
      </div>

      <div
        id="channelValue"
        class="value"
      ></div>

      <button
        class="copy-btn"
        data-copy="channelValue"
      >
        복사
      </button>
    </div>


    <div class="report-row">
      <div class="label">
        제목
      </div>

      <div
        id="titleValue"
        class="value"
      ></div>

      <button
        class="copy-btn"
        data-copy="titleValue"
      >
        복사
      </button>
    </div>


    <div class="report-row">
      <div class="label">
        작성자
      </div>

      <div
        id="authorValue"
        class="value"
      ></div>

      <button
        class="copy-btn"
        data-copy="authorValue"
      >
        복사
      </button>
    </div>


    <div class="report-row">
      <div class="label">
        게시 일자
      </div>

      <div
        id="dateValue"
        class="value"
      ></div>

      <button
        class="copy-btn"
        data-copy="dateValue"
      >
        복사
      </button>
    </div>


    <div class="report-row">
      <div class="label">
        게시물 URL
      </div>

      <div
        id="urlValue"
        class="value"
      ></div>

      <button
        class="copy-btn"
        data-copy="urlValue"
      >
        복사
      </button>
    </div>


    <div class="report-row">
      <div class="label">
        권장 유형
      </div>

      <div class="value">
        <span class="badge">
          비방 / 명예훼손 여부 확인
        </span>
      </div>
    </div>


    <div class="report-row">
      <div class="label">
        신고 내용
      </div>

      <textarea
        id="reportContent"
        maxlength="1000"
      ></textarea>

      <button
        id="copyReportBtn"
        class="copy-btn"
      >
        신고 내용 복사
      </button>

      <div
        id="charCount"
        class="hint"
      ></div>
    </div>


    <a
      id="openReportBtn"
      class="btn report"
      href="https://protect.galaxyuniverse.ai/rights-violations/new"
      target="_blank"
      rel="noopener noreferrer"
    >
      Galaxy 신고 페이지 열기
    </a>

    <div class="hint">
      현재 버전에서는 Galaxy 신고 페이지를 열고,
      위 정보를 복사해서 붙여넣는 방식입니다.
      생성된 PDF는 위의 PDF 다운로드 버튼으로 받아 첨부하면 됩니다.
    </div>

  </div>

</div>


<script>

const btn =
  document.getElementById('captureBtn');

const urlInput =
  document.getElementById('urlInput');

const statusEl =
  document.getElementById('status');

const resultCard =
  document.getElementById('resultCard');

const metaBox =
  document.getElementById('metaBox');

const downloadLink =
  document.getElementById('downloadLink');

const reportCard =
  document.getElementById('reportCard');

const channelValue =
  document.getElementById('channelValue');

const titleValue =
  document.getElementById('titleValue');

const authorValue =
  document.getElementById('authorValue');

const dateValue =
  document.getElementById('dateValue');

const urlValue =
  document.getElementById('urlValue');

const reportContent =
  document.getElementById('reportContent');

const copyReportBtn =
  document.getElementById('copyReportBtn');

const charCount =
  document.getElementById('charCount');


function escapeHtml(value) {

  if (!value) return '';

  return value
    .toString()
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


function detectChannel(url) {

  try {

    const host =
      new URL(url).hostname;

    const map = {

      'gall.dcinside.com':
        '디시인사이드',

      'www.fmkorea.com':
        '에펨코리아',

      'fmkorea.com':
        '에펨코리아',

      'theqoo.net':
        '더쿠',

      'www.theqoo.net':
        '더쿠',

      'x.com':
        'X (트위터)',

      'twitter.com':
        'X (트위터)',

      'www.youtube.com':
        '유튜브',

      'youtube.com':
        '유튜브',

      'www.instagram.com':
        '인스타그램',

      'instagram.com':
        '인스타그램',

    };

    return map[host] || host;

  } catch {

    return '확인 필요';

  }

}


function cleanDate(rawDate) {

  if (!rawDate)
    return '(추출 실패)';

  return rawDate
    .replace(/\s+/g, ' ')
    .trim();

}


function buildReportText(meta) {

  const title =
    meta.title ||
    '(제목 확인 필요)';

  const author =
    meta.author ||
    '(작성자 확인 필요)';

  const date =
    meta.date ||
    '(게시일 확인 필요)';

  const channel =
    detectChannel(meta.url);

  const text =
`아래 게시물에 대해 권리침해 여부 확인 및 조치를 요청드립니다.

게시 채널: ${channel}
게시물 제목: ${title}
게시물 작성자: ${author}
게시 일자: ${date}
게시물 URL: ${meta.url}

해당 게시물의 내용이 비방, 명예훼손 또는 기타 권리침해에 해당하는지 확인 부탁드립니다.

증거 보존을 위해 원본 게시물 전체 페이지를 PDF로 저장하여 첨부합니다.
증거 수집 시각: ${new Date(meta.capturedAt).toLocaleString('ko-KR')}`;

  return text.slice(0, 1000);

}


function updateCharCount() {

  charCount.textContent =
    `${reportContent.value.length} / 1000자`;

}


function showReport(meta) {

  const channel =
    detectChannel(meta.url);

  channelValue.textContent =
    channel;

  titleValue.textContent =
    meta.title ||
    '(추출 실패)';

  authorValue.textContent =
    meta.author ||
    '(추출 실패)';

  dateValue.textContent =
    cleanDate(meta.date);

  urlValue.textContent =
    meta.url || '';

  reportContent.value =
    buildReportText(meta);

  updateCharCount();

  reportCard.style.display =
    'block';

}


btn.addEventListener(
  'click',
  async () => {

    const url =
      urlInput.value.trim();

    if (!url) {

      statusEl.innerHTML =
        '<span class="error">URL을 입력해주세요.</span>';

      return;

    }

    btn.disabled = true;

    statusEl.textContent =
      '페이지 접속 및 증거 수집 중...';

    resultCard.style.display =
      'none';

    reportCard.style.display =
      'none';

    try {

      const res =
        await fetch(
          '/api/capture',
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'application/json',
            },

            body:
              JSON.stringify({
                url,
              }),
          }
        );

      if (!res.ok) {

        const err =
          await res
            .json()
            .catch(
              () => ({})
            );

        throw new Error(
          err.error ||
          '알 수 없는 오류'
        );

      }

      const metaHeader =
        res.headers.get(
          'X-Evidence-Meta'
        );

      const meta =
        metaHeader
          ? JSON.parse(
              decodeURIComponent(
                metaHeader
              )
            )
          : {};

      const blob =
        await res.blob();

      const blobUrl =
        URL.createObjectURL(
          blob
        );

      downloadLink.href =
        blobUrl;

      downloadLink.download =
        `evidence_${Date.now()}.pdf`;

      metaBox.innerHTML = `

        <div class="meta-row">

          <div class="label">
            제목
          </div>

          <div class="value">
            ${escapeHtml(
              meta.title ||
              '(추출 실패)'
            )}
          </div>

        </div>

        <div class="meta-row">

          <div class="label">
            작성자
          </div>

          <div class="value">
            ${escapeHtml(
              meta.author ||
              '(추출 실패)'
            )}
          </div>

        </div>

        <div class="meta-row">

          <div class="label">
            작성일
          </div>

          <div class="value">
            ${escapeHtml(
              meta.date ||
              '(추출 실패)'
            )}
          </div>

        </div>

        <div class="meta-row">

          <div class="label">
            수집시각
          </div>

          <div class="value">
            ${
              meta.capturedAt
                ? new Date(
                    meta.capturedAt
                  )
                  .toLocaleString(
                    'ko-KR'
                  )
                : '-'
            }
          </div>

        </div>

        <div class="meta-row">

          <div class="label">
            SHA-256
          </div>

          <div class="value">
            ${
              meta.hash
                ? escapeHtml(
                    meta.hash
                  )
                : '-'
            }
          </div>

        </div>

      `;

      resultCard.style.display =
        'block';

      showReport(meta);

      statusEl.innerHTML =
        '<span class="success">증거 PDF 생성 완료</span>';

    } catch (e) {

      statusEl.innerHTML =
        `<span class="error">오류: ${escapeHtml(e.message)}</span>`;

    } finally {

      btn.disabled =
        false;

    }

  }
);


document
  .querySelectorAll(
    '[data-copy]'
  )
  .forEach(
    (button) => {

      button.addEventListener(
        'click',
        async () => {

          const targetId =
            button.dataset.copy;

          const el =
            document.getElementById(
              targetId
            );

          if (!el)
            return;

          try {

            await navigator
              .clipboard
              .writeText(
                el.textContent.trim()
              );

            const oldText =
              button.textContent;

            button.textContent =
              '복사됨';

            setTimeout(
              () => {
                button.textContent =
                  oldText;
              },
              1200
            );

          } catch {

            alert(
              '복사에 실패했습니다. 직접 선택해서 복사해주세요.'
            );

          }

        }
      );

    }
  );


copyReportBtn.addEventListener(
  'click',
  async () => {

    try {

      await navigator
        .clipboard
        .writeText(
          reportContent.value
        );

      const oldText =
        copyReportBtn.textContent;

      copyReportBtn.textContent =
        '복사됨';

      setTimeout(
        () => {
          copyReportBtn.textContent =
            oldText;
        },
        1200
      );

    } catch {

      alert(
        '복사에 실패했습니다. 신고 내용을 직접 선택해서 복사해주세요.'
      );

    }

  }
);


reportContent.addEventListener(
  'input',
  updateCharCount
);

</script>

</body>
</html>
